# Render blueprint for the Nabdh backend.
# README references this file: build installs backend deps, start runs the server.
# Secrets (NVIDIA_API_KEY) are set in the Render dashboard, never committed here.

databases:
  - name: nabdh-db
    plan: free
    databaseName: nabdh

services:
  - type: web
    name: nabdh
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NVIDIA_API_KEY
        sync: false # paste in the dashboard
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: RANK_PRE_FILTER_LIMIT
        value: "12"
      - key: BRIEF_ITEM_LIMIT
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: nabdh-db
          property: connectionString
      - key: PG_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
